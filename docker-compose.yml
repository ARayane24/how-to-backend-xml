version: '3.8'

services:
  app:
    build:
      context: .
      args:
        - NODE_VERSION=18
    container_name: app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis
    networks:
      - laravel-network

  db:
    image: postgres:15-alpine
    container_name: db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: how-to-backend_db
      POSTGRES_USER: how-to-backend_user
      POSTGRES_PASSWORD: acS040uEfR6cZWp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - laravel-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass MnvnVKaHDWDVRwq
    volumes:
      - redisdata:/data
    networks:
      - laravel-network

volumes:
  pgdata:
  redisdata:

networks:
  laravel-network:
    driver: bridge
